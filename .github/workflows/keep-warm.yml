name: Keep API warm

# Render's free tier spins the service down after ~15 min idle; the next request then pays a
# ~50s cold start (and returns 502 meanwhile), which shows up as login failures and slow first
# loads. Pinging /health every 10 min keeps it awake. (GitHub's scheduler is best-effort and may
# run a few minutes late; that's fine for a 15 min idle window.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS --max-time 120 https://ennoia.onrender.com/health || true
