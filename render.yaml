services:
  - type: web
    name: ennoia-api
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @ennoia/core build && corepack pnpm --filter @ennoia/server build
    startCommand: pnpm --filter @ennoia/server start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_MODE
        value: production
      - key: ENABLE_SEED
        value: "false"
      - key: ENABLE_DEMO_ROUTES
        value: "false"
